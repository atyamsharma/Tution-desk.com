<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuitionDesk - Complete Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex flex-col justify-center items-center p-4 font-sans">

    <!-- Main Container -->
    <div id="app-container" class="w-full max-w-lg bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        
        <!-- HEADER -->
        <div class="bg-gradient-to-r from-indigo-600 to-violet-700 p-6 text-white text-center relative">
            <h1 id="app-title" class="text-2xl font-black tracking-tight">TuitionDesk</h1>
            <p id="app-subtitle" class="text-indigo-100 text-sm mt-1 font-medium">Advanced Student & Tuition Manager</p>
        </div>

        <!-- VIEW 1: AUTHENTICATION -->
        <div id="view-auth" class="p-6 space-y-6">
            <div class="flex bg-slate-100 p-1.5 rounded-2xl">
                <button id="tab-auth-student" onclick="switchAuthMode('student')" class="flex-1 py-3 text-sm font-bold rounded-xl bg-white text-indigo-600 shadow-md transition-all">Student / Parent</button>
                <button id="tab-auth-admin" onclick="switchAuthMode('admin')" class="flex-1 py-3 text-sm font-bold rounded-xl text-slate-600 transition-all">Admin / Staff</button>
            </div>

            <!-- Student Login -->
            <div id="form-student" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Select Student Name</label>
                    <select id="student-selector" class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-4 py-3.5 font-bold text-slate-800 focus:border-indigo-500 focus:outline-none">
                        <option value="Aarav Sharma">Aarav Sharma</option>
                        <option value="Priya Verma">Priya Verma</option>
                        <option value="Kabir Singh">Kabir Singh</option>
                    </select>
                </div>
                <button onclick="loginAsStudent()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg transition-all">Enter Student Dashboard</button>
            </div>

            <!-- Admin Login -->
            <div id="form-admin" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Enter Admin PIN</label>
                    <input type="password" id="admin-pin-input" placeholder="Default PIN: 12345" class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-4 py-3.5 font-mono text-center tracking-widest font-black text-slate-800 focus:border-indigo-500 focus:outline-none">
                </div>
                <div id="admin-login-error" class="bg-red-50 text-red-600 text-xs font-bold p-3 rounded-xl border border-red-200 text-center hidden">Wrong PIN! Please enter 12345.</div>
                <button onclick="verifyAdminPin()" class="w-full bg-slate-900 hover:bg-black text-white font-black py-4 rounded-2xl shadow-lg transition-all">Unlock Admin Console</button>
            </div>
        </div>

        <!-- VIEW 2: DASHBOARD -->
        <div id="view-dashboard" class="hidden flex flex-col h-[650px]">
            <!-- Dashboard Header -->
            <div class="bg-slate-50 border-b p-4 flex items-center justify-between">
                <div>
                    <h2 id="dashboard-user-title" class="text-lg font-black text-slate-800">Dashboard</h2>
                    <p class="text-xs text-slate-500 font-medium">Active Date: <span id="current-date-display" class="font-bold text-indigo-600"></span></p>
                </div>
                <button onclick="logout()" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold px-4 py-2 rounded-xl transition-all">Logout</button>
            </div>

            <!-- Stats Bar (Admin) -->
            <div id="admin-stats-bar" class="grid grid-cols-2 gap-3 p-4 bg-indigo-900 text-white">
                <div class="bg-indigo-800/50 p-3 rounded-2xl border border-indigo-700/50">
                    <p class="text-[10px] uppercase font-bold text-indigo-200">Today's Attendance</p>
                    <p class="text-xl font-black mt-1" id="stat-attendance-count">2 / 3 Present</p>
                </div>
                <div class="bg-indigo-800/50 p-3 rounded-2xl border border-indigo-700/50">
                    <p class="text-[10px] uppercase font-bold text-indigo-200">Total Fees Collected</p>
                    <p class="text-xl font-black mt-1">₹1,500 / ₹3,000</p>
                </div>
            </div>

            <!-- TAB CONTENT AREA -->
            <div id="tab-content" class="flex-1 p-6 overflow-y-auto space-y-6">
                <!-- Content loaded dynamically -->
            </div>

            <!-- NAVIGATION BAR -->
            <div id="admin-nav-bar" class="grid grid-cols-5 border-t bg-white py-2 px-1 text-center">
                <button onclick="switchTab('overview')" id="nav-btn-overview" class="py-2 transition-all flex flex-col items-center text-indigo-600 font-black scale-105">
                    <span class="text-lg">🏠</span>
                    <span class="text-[10px]">Home</span>
                </button>
                <button onclick="switchTab('students')" id="nav-btn-students" class="py-2 transition-all flex flex-col items-center text-slate-400 hover:text-slate-600">
                    <span class="text-lg">👥</span>
                    <span class="text-[10px]">Students</span>
                </button>
                <button onclick="switchTab('attendance')" id="nav-btn-attendance" class="py-2 transition-all flex flex-col items-center text-slate-400 hover:text-slate-600">
                    <span class="text-lg">📅</span>
                    <span class="text-[10px]">Attendance</span>
                </button>
                <button onclick="switchTab('fees')" id="nav-btn-fees" class="py-2 transition-all flex flex-col items-center text-slate-400 hover:text-slate-600">
                    <span class="text-lg">💳</span>
                    <span class="text-[10px]">Fees</span>
                </button>
                <button onclick="switchTab('settings')" id="nav-btn-settings" class="py-2 transition-all flex flex-col items-center text-slate-400 hover:text-slate-600">
                    <span class="text-lg">⚙️</span>
                    <span class="text-[10px]">Settings</span>
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        let currentRole = 'admin';
        let loggedInStudent = '';
        
        // App Data State
        let selectedDate = new Date().toISOString().split('T')[0];
        let attendanceRecords = {
            [selectedDate]: { 'Aarav Sharma': 'P', 'Priya Verma': 'A', 'Kabir Singh': 'P' }
        };
        let studentFees = {
            'Aarav Sharma': { status: 'Paid', amount: 1500, phone: '9876543210' },
            'Priya Verma': { status: 'Pending', amount: 1500, phone: '9876543211' },
            'Kabir Singh': { status: 'Paid', amount: 1500, phone: '9876543212' }
        };
        let dailyHomework = "Complete Math Exercise 5.2 & Read Science Chapter 4.";

        updateDateDisplay();

        function updateDateDisplay() {
            document.getElementById('current-date-display').innerText = selectedDate;
        }

        function changeDate(days) {
            let d = new Date(selectedDate);
            d.setDate(d.getDate() + days);
            selectedDate = d.toISOString().split('T')[0];
            updateDateDisplay();
            switchTab('attendance');
        }

        function switchAuthMode(mode) {
            const stuTab = document.getElementById('tab-auth-student');
            const adminTab = document.getElementById('tab-auth-admin');
            const stuForm = document.getElementById('form-student');
            const adminForm = document.getElementById('form-admin');

            if (mode === 'student') {
                stuTab.className = "flex-1 py-3 text-sm font-bold rounded-xl bg-white text-indigo-600 shadow-md transition-all";
                adminTab.className = "flex-1 py-3 text-sm font-bold rounded-xl text-slate-600 transition-all";
                stuForm.classList.remove('hidden');
                adminForm.classList.add('hidden');
            } else {
                adminTab.className = "flex-1 py-3 text-sm font-bold rounded-xl bg-white text-indigo-600 shadow-md transition-all";
                stuTab.className = "flex-1 py-3 text-sm font-bold rounded-xl text-slate-600 transition-all";
                adminForm.classList.remove('hidden');
                stuForm.classList.add('hidden');
                document.getElementById('admin-login-error').classList.add('hidden');
            }
        }

        function verifyAdminPin() {
            const pin = document.getElementById('admin-pin-input').value.trim();
            if (pin === "12345") {
                document.getElementById('admin-login-error').classList.add('hidden');
                initDashboard('admin');
            } else {
                document.getElementById('admin-login-error').classList.remove('hidden');
            }
        }

        function loginAsStudent() {
            loggedInStudent = document.getElementById('student-selector').value;
            initDashboard('student');
        }

        function initDashboard(role) {
            currentRole = role;
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            
            const statsBar = document.getElementById('admin-stats-bar');
            const navBar = document.getElementById('admin-nav-bar');

            if (role === 'admin') {
                document.getElementById('dashboard-user-title').innerText = "Administrator Panel";
                statsBar.classList.remove('hidden');
                navBar.classList.remove('hidden');
                switchTab('overview');
            } else {
                document.getElementById('dashboard-user-title').innerText = "Student: " + loggedInStudent;
                statsBar.classList.add('hidden');
                navBar.classList.add('hidden');
                renderStudentPortal();
            }
        }

        function switchTab(tabId) {
            ['overview', 'students', 'attendance', 'fees', 'settings'].forEach(id => {
                const btn = document.getElementById(`nav-btn-${id}`);
                if(btn) btn.className = "py-2 transition-all flex flex-col items-center " + (id === tabId ? "text-indigo-600 font-black scale-105" : "text-slate-400 hover:text-slate-600");
            });

            const container = document.getElementById('tab-content');
            container.innerHTML = '';

            if(!attendanceRecords[selectedDate]) {
                attendanceRecords[selectedDate] = { 'Aarav Sharma': 'P', 'Priya Verma': 'P', 'Kabir Singh': 'P' };
            }

            switch(tabId) {
                case 'overview':
                    container.innerHTML = `
                        <div class="space-y-4">
                            <div class="bg-gradient-to-br from-indigo-500 to-violet-600 p-6 rounded-3xl text-white shadow-lg">
                                <h3 class="text-xl font-black">Welcome Back, Admin</h3>
                                <p class="text-xs text-indigo-100 mt-1">Today's Homework & Quick Overview</p>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                <h4 class="font-bold text-xs uppercase text-indigo-600 mb-1">📅 Today's Homework Assigned</h4>
                                <p class="text-sm font-medium text-slate-800">${dailyHomework}</p>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div onclick="switchTab('students')" class="bg-slate-50 p-4 rounded-2xl border border-slate-200 cursor-pointer hover:border-indigo-500 transition-all text-center">
                                    <span class="block text-2xl mb-1">👥</span>
                                    <span class="font-bold text-xs text-slate-700">Manage Students</span>
                                </div>
                                <div onclick="switchTab('fees')" class="bg-slate-50 p-4 rounded-2xl border border-slate-200 cursor-pointer hover:border-indigo-500 transition-all text-center">
                                    <span class="block text-2xl mb-1">💳</span>
                                    <span class="font-bold text-xs text-slate-700">Fee Counter</span>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
                case 'students':
                    container.innerHTML = `
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="font-black text-slate-800 text-base">Student Directories</h3>
                                <button onclick="alert('Add student feature')" class="bg-indigo-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl">+ Add Student</button>
                            </div>
                            <div class="space-y-3">
                                <div class="bg-slate-50 p-4 rounded-2xl border space-y-2">
                                    <div class="flex justify-between items-center"><span class="font-bold text-slate-800">Aarav Sharma</span><span class="text-xs bg-indigo-50 text-indigo-600 font-bold px-2.5 py-1 rounded-full">Class 8</span></div>
                                    <p class="text-xs text-slate-500">Phone: 9876543210 | Monthly Fees: ₹1,500</p>
                                </div>
                                <div class="bg-slate-50 p-4 rounded-2xl border space-y-2">
                                    <div class="flex justify-between items-center"><span class="font-bold text-slate-800">Priya Verma</span><span class="text-xs bg-indigo-50 text-indigo-600 font-bold px-2.5 py-1 rounded-full">Class 8</span></div>
                                    <p class="text-xs text-slate-500">Phone: 9876543211 | Monthly Fees: ₹1,500</p>
                                </div>
                                <div class="bg-slate-50 p-4 rounded-2xl border space-y-2">
                                    <div class="flex justify-between items-center"><span class="font-bold text-slate-800">Kabir Singh</span><span class="text-xs bg-indigo-50 text-indigo-600 font-bold px-2.5 py-1 rounded-full">Class 8</span></div>
                                    <p class="text-xs text-slate-500">Phone: 9876543212 | Monthly Fees: ₹1,500</p>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
                case 'attendance':
                    let attList = Object.keys(studentFees).map(name => {
                        let status = attendanceRecords[selectedDate][name] || 'P';
                        return `
                            <div class="bg-slate-50 p-3 rounded-2xl border flex justify-between items-center">
                                <span class="font-bold text-sm text-slate-800">${name}</span>
                                <div class="flex gap-1">
                                    <button onclick="setAttendance('${name}', 'P')" class="px-3 py-1 text-xs font-black rounded-lg transition-all ${status === 'P' ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-200 text-slate-600'}">P</button>
                                    <button onclick="setAttendance('${name}', 'A')" class="px-3 py-1 text-xs font-black rounded-lg transition-all ${status === 'A' ? 'bg-red-600 text-white shadow-md' : 'bg-slate-200 text-slate-600'}">A</button>
                                </div>
                            </div>
                        `;
                    }).join('');

                    container.innerHTML = `
                        <div class="space-y-4">
                            <div class="flex justify-between items-center bg-indigo-50 p-3 rounded-2xl border border-indigo-100">
                                <button onclick="changeDate(-1)" class="px-3 py-1 bg-white rounded-xl shadow text-xs font-bold">◀ Prev</button>
                                <span class="font-black text-sm text-indigo-900" id="att-date-label">${selectedDate}</span>
                                <button onclick="changeDate(1)" class="px-3 py-1 bg-white rounded-xl shadow text-xs font-bold">Next ▶</button>
                            </div>
                            <h3 class="font-black text-slate-800 text-base">Mark Attendance (P / A)</h3>
                            <div class="space-y-2">${attList}</div>
                        </div>
                    `;
                    break;
                case 'fees':
                    let feeList = Object.keys(studentFees).map(name => {
                        let info = studentFees[name];
                        return `
                            <div class="bg-slate-50 p-3 rounded-2xl border flex justify-between items-center">
                                <div>
                                    <p class="font-bold text-sm text-slate-800">${name}</p>
                                    <p class="text-[10px] ${info.status === 'Paid' ? 'text-emerald-600 font-bold' : 'text-red-500 font-bold'}">Status: ${info.status}</p>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="font-black text-slate-700 text-sm">₹${info.amount}</span>
                                    <button onclick="sendFeeAlert('${name}', '${info.phone}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-bold px-2.5 py-1.5 rounded-xl shadow">Send Alert</button>
                                </div>
                            </div>
                        `;
                    }).join('');

                    container.innerHTML = `
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="font-black text-slate-800 text-base">Fee Counter & Alerts</h3>
                                <button onclick="sendAllReminders()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-2 rounded-xl shadow">📢 Remind All</button>
                            </div>
                            <div class="space-y-3">${feeList}</div>
                        </div>
                    `;
                    break;
                case 'settings':
                    container.innerHTML = `
                        <div class="space-y-4">
                            <h3 class="font-black text-slate-800 text-base">System Settings & Homework</h3>
                            <div class="bg-slate-50 p-4 rounded-2xl border space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Update Today's Homework</label>
                                    <input type="text" id="homework-input" value="${dailyHomework}" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-800 font-medium mb-2">
                                    <button onclick="saveHomework()" class="bg-indigo-600 text-white text-
