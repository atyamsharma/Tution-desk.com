<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>TuitionDesk</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Poppins',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}main>*{animation:up .35s ease both}button:active,a:active{transform:scale(.96)}</style>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-slate-100 to-violet-100 text-slate-800 select-none">
<div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-xl relative"></div>
<script type="module">
/* ============ SETTINGS (edit these) ============ */
const ACADEMY = "Guru Ji Academy";
const ADMIN_PASS = "12345";              // mam / staff password
const UPI_ID = "yourname@upi";           // fees are paid to this UPI ID
// Paste your Firebase web-app config here to sync all phones. Leave apiKey empty = offline mode (this phone only).
const FIREBASE = { apiKey: "", authDomain: "", projectId: "", appId: "" };
/* ================================================ */

const app = document.getElementById('app');
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const TODAY = ymd(new Date()), MONTH0 = TODAY.slice(0, 7);
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mLabel = m => MN[+m.slice(5) - 1] + ' ' + m.slice(0, 4);
const shiftM = (m, k) => { const d = new Date(+m.slice(0, 4), +m.slice(5) - 1 + k, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
const ncls = s => String(s || '').toLowerCase().replace(/class|th|st|nd|rd|\s/g, '');
const ph = p => { const d = String(p || '').replace(/\D/g, ''); return d.length === 10 ? '91' + d : d; };
const dm = (a, b) => { for (const k in b) { if (b[k] && typeof b[k] === 'object') { a[k] = a[k] && typeof a[k] === 'object' ? a[k] : {}; dm(a[k], b[k]); } else a[k] = b[k]; } return a; };

let db = {}, remote = null, ready = false, dirty = false;
const S = { user: null, tab: '', lrole: 'student', f: {}, err: '', cls: '', date: TODAY, month: MONTH0, draft: {}, alert: null, add: false };
try { S.user = JSON.parse(localStorage.getItem('td_user')); } catch (e) {}

/* ---------- data ---------- */
function save(patch) {
  dm(db, patch);
  if (remote) remote.F.setDoc(remote.ref, patch, { merge: true }).catch(e => toast('Save failed: ' + e.message));
  else { try { localStorage.setItem('td_db', JSON.stringify(db)); } catch (e) {} }
  render();
}
async function init() {
  if (!FIREBASE.apiKey) {
    try { db = JSON.parse(localStorage.getItem('td_db')) || {}; } catch (e) { db = {}; }
    ready = true; render(); return;
  }
  render();
  try {
    const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const F = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const ref = F.doc(F.getFirestore(A.initializeApp(FIREBASE)), 'tuition', 'data');
    remote = { F, ref };
    F.onSnapshot(ref, s => {
      db = s.exists() ? s.data() : {}; ready = true;
      const t = document.activeElement && document.activeElement.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') dirty = true; else render();
    }, e => toast('Connection problem: ' + e.message));
  } catch (e) { toast('Could not connect: ' + e.message); }
}
function toast(m) {
  const t = document.createElement('div');
  t.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-sm px-4 py-2 rounded-xl shadow-lg max-w-[90%]';
  t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}

/* ---------- helpers ---------- */
const stu = () => Object.entries(db.students || {}).map(([id, s]) => ({ id, ...s })).filter(s => !s.off && s.name)
  .sort((a, b) => String(a.cls).localeCompare(String(b.cls), undefined, { numeric: true }) || a.name.localeCompare(b.name));
const classes = () => [...new Set(stu().map(s => s.cls))].sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }));
const attStat = (id, m) => {
  let p = 0, a = 0;
  for (const [d, r] of Object.entries(db.att || {})) { if (m && !d.startsWith(m)) continue; const v = r && r[id]; if (v === 'P') p++; else if (v === 'A') a++; }
  return { p, a, pct: p + a ? Math.round(p * 100 / (p + a)) : null };
};
const pend = s => { const o = []; let m = s.joined || MONTH0; while (m <= MONTH0) { if (!(s.paid && s.paid[m])) o.push(m); m = shiftM(m, 1); } return o; };
const lateDays = s => { const p = pend(s); return p.length ? Math.max(0, Math.floor((Date.now() - new Date(p[0] + '-05').getTime()) / 864e5)) : 0; };
const testsOf = id => Object.entries(db.tests || {}).map(([tid, t]) => ({ tid, ...t })).filter(t => t.marks && t.marks[id] !== undefined && t.marks[id] !== '')
  .sort((a, b) => (a.date + a.tid).localeCompare(b.date + b.tid));
const rank = (t, id) => 1 + Object.values(t.marks).filter(v => +v > +t.marks[id]).length;
const avgPct = id => { const T = testsOf(id); return T.length ? Math.round(T.reduce((a, t) => a + (+t.marks[id] / +t.max) * 100, 0) / T.length) : null; };

const card = (l, v, c) => `<div class="p-3 rounded-2xl shadow-sm bg-${c}-50 border border-${c}-100"><p class="text-[11px] font-semibold text-${c}-600">${l}</p><p class="text-xl font-black text-${c}-900">${v}</p></div>`;
const empty = t => `<div class="text-center text-slate-400 text-sm py-10">${t}</div>`;
const av = n => `<div class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-violet-500 ring-2 ring-white text-white font-bold flex items-center justify-center shrink-0">${esc(String(n || '?').trim()[0] || '?').toUpperCase()}</div>`;
const h2 = t => `<h2 class="text-base font-bold mb-3">${t}</h2>`;
const bar = (l, p, c) => `<div class="mt-2"><div class="flex justify-between text-[11px] font-semibold text-slate-500"><span>${l}</span><span>${p === null ? 'No data' : p + '%'}</span></div><div class="h-2.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full bg-${c}-500" style="width:${p || 0}%"></div></div></div>`;
const inp = 'w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500';
const btn = 'w-full bg-indigo-600 text-white py-3 rounded-xl font-bold shadow active:scale-95 transition';
const clsSel = all => `<select data-ch="cls" class="${inp} !w-auto flex-1">${all ? '<option value="">All classes</option>' : '<option value="">Choose class</option>'}${classes().map(c => `<option ${S.cls === c ? 'selected' : ''} value="${esc(c)}">Class ${esc(c)}</option>`).join('')}</select>`;
const waLink = (p, msg) => `https://wa.me/${ph(p)}?text=${encodeURIComponent(msg)}`;

/* ---------- login ---------- */
function vLogin() {
  const ad = S.lrole === 'admin';
  const tb = (k, l) => `<button data-a="role" data-v="${k}" class="flex-1 py-2 rounded-lg text-sm font-bold ${S.lrole === k ? 'bg-white shadow text-indigo-700' : 'text-slate-500'}">${l}</button>`;
  return `<div class="min-h-screen p-6 pt-16 bg-gradient-to-b from-indigo-600 to-violet-700">
  <div class="text-center text-white mb-8"><div class="text-6xl mb-2">🎓</div><h1 class="text-3xl font-extrabold">TuitionDesk</h1><p class="text-indigo-200 text-sm">${esc(ACADEMY)}</p></div>
  <div class="bg-white rounded-3xl p-5 shadow-2xl space-y-3">
    <div class="flex bg-slate-100 rounded-xl p-1">${tb('student', '🧑‍🎓 Student')}${tb('admin', '👩‍🏫 Mam / Staff')}</div>
    ${ad ? `<input type="password" data-in="pass" value="${esc(S.f.pass || '')}" placeholder="Enter password" class="${inp} text-center tracking-widest">`
      : `<input data-in="name" value="${esc(S.f.name || '')}" placeholder="Your full name" class="${inp}"><input data-in="cls" value="${esc(S.f.cls || '')}" placeholder="Your class (e.g. 8)" class="${inp}">`}
    ${S.err ? `<p class="text-xs font-bold text-red-500 text-center">${esc(S.err)}</p>` : ''}
    <button data-a="login" class="${btn}">${ad ? 'Unlock' : 'Open My App'}</button>
  </div></div>`;
}
function doLogin() {
  if (!ready) return;
  if (S.lrole === 'admin') {
    if ((S.f.pass || '') !== ADMIN_PASS) { S.err = 'Wrong password'; return render(); }
    return session({ role: 'admin' });
  }
  const s = stu().find(x => nm(x.name) === nm(S.f.name) && ncls(x.cls) === ncls(S.f.cls));
  if (!s) { S.err = 'Not found. Check name & class, or ask mam to add you.'; return render(); }
  session({ role: 'student', id: s.id });
}
function session(u) {
  S.user = u; S.tab = u.role === 'admin' ? 'fees' : 'home'; S.f = {}; S.err = ''; S.cls = ''; S.draft = {}; S.alert = null; S.month = MONTH0;
  try { localStorage.setItem('td_user', JSON.stringify(u)); } catch (e) {}
  render();
}
function logout() { S.user = null; S.f = {}; S.err = ''; try { localStorage.removeItem('td_user'); } catch (e) {} render(); }

/* ---------- admin views ---------- */
function aFees() {
  const all = stu(), L = all.map(s => ({ s, p: pend(s) })).filter(x => x.p.length);
  const tot = L.reduce((a, x) => a + x.p.length * (+x.s.fee || 0), 0);
  const col = all.filter(s => s.paid && s.paid[MONTH0]).reduce((a, s) => a + (+s.fee || 0), 0);
  const todayRec = db.att && db.att[TODAY];
  return `<div class="grid grid-cols-2 gap-3 mb-3">${card('Total Students', all.length, 'violet')}${card('Present Today', todayRec ? Object.values(todayRec).filter(v => v === 'P').length : '–', 'green')}</div><div class="grid grid-cols-2 gap-3 mb-4">${card('Collected in ' + MN[+MONTH0.slice(5) - 1], '₹' + col, 'indigo')}${card('Total Pending', '₹' + tot, 'red')}</div>
  ${h2('Pending Fees (' + L.length + ')')}` + (L.length ? L.map(({ s, p }) => {
    const amt = p.length * (+s.fee || 0), late = lateDays(s);
    const msg = `Dear Parent, fee of Rs.${amt} for ${s.name} (Class ${s.cls}) is pending for ${p.map(mLabel).join(', ')}. Kindly pay at the earliest. - ${ACADEMY}`;
    return `<div class="p-3 mb-3 border border-red-200 bg-red-50 rounded-2xl">
      <div class="flex justify-between"><div><p class="font-bold">${esc(s.name)}</p><p class="text-xs text-slate-500">Class ${esc(s.cls)} · ${p.length} month(s) · ₹${amt}</p></div>
      <span class="h-fit text-[11px] font-bold text-red-600 bg-red-100 px-2 py-0.5 rounded">${late ? late + ' days late' : 'Due'}</span></div>
      <div class="flex gap-2 mt-3"><a target="_blank" href="${waLink(s.phone, msg)}" class="flex-1 text-center bg-green-500 text-white text-xs font-bold py-2 rounded-lg">WhatsApp Remind</a>
      <button data-a="paid" data-id="${s.id}" data-m="${p[0]}" class="flex-1 bg-indigo-600 text-white text-xs font-bold py-2 rounded-lg">Mark ${MN[+p[0].slice(5) - 1]} Paid</button></div></div>`;
  }).join('') : empty('🎉 No pending fees'));
}
function aAtt() {
  const L = stu().filter(s => !S.cls || s.cls === S.cls), g = id => S.draft[id] || (db.att && db.att[S.date] && db.att[S.date][id]) || 'P';
  const hwKey = ncls(S.cls), hw = S.f.hw !== undefined ? S.f.hw : ((db.hw && db.hw[hwKey]) || '');
  const b = (id, v, on, c) => `<button data-a="tog" data-id="${id}" data-v="${v}" class="px-4 py-1.5 rounded-lg text-sm font-bold ${on ? 'bg-' + c + '-600 text-white' : 'bg-slate-200 text-slate-600'}">${v}</button>`;
  return `<div class="flex gap-2 mb-3"><input type="date" data-ch="date" value="${S.date}" max="${TODAY}" class="${inp} !w-auto flex-1">${clsSel(true)}</div>
  ${L.length ? L.map(s => `<div class="p-3 mb-2 border rounded-2xl bg-slate-50 flex justify-between items-center"><div class="flex items-center gap-3">${av(s.name)}<div><p class="font-semibold text-sm">${esc(s.name)}</p><p class="text-[11px] text-slate-400">Class ${esc(s.cls)}</p></div></div><div class="flex gap-2">${b(s.id, 'P', g(s.id) === 'P', 'green')}${b(s.id, 'A', g(s.id) === 'A', 'red')}</div></div>`).join('')
    + `<button data-a="saveAtt" class="${btn} mt-2">Save Attendance</button>` : empty('Add students first (Students tab)')}
  ${S.alert ? `<div class="mt-4 p-3 rounded-2xl bg-amber-50 border border-amber-200"><p class="text-sm font-bold mb-2">Saved ✔ Alert parents of absent students:</p>${S.alert.length ? S.alert.map(s => `<a target="_blank" href="${waLink(s.phone, `Dear Parent, ${s.name} was absent from tuition today (${S.date}). - ${ACADEMY}`)}" class="block mb-2 text-center bg-green-500 text-white text-xs font-bold py-2 rounded-lg">WhatsApp ${esc(s.name)}'s parent</a>`).join('') : '<p class="text-xs text-slate-500">Everyone was present 🎉</p>'}</div>` : ''}
  <div class="mt-6">${h2('Homework' + (S.cls ? ' – Class ' + esc(S.cls) : ''))}${S.cls ? `<textarea data-in="hw" rows="3" placeholder="Today's homework..." class="${inp}">${esc(hw)}</textarea><button data-a="saveHw" class="${btn} mt-2">Save Homework</button>` : '<p class="text-xs text-slate-400">Choose a class above to set homework.</p>'}</div>`;
}
function aStu() {
  const q = nm(S.f.q), L = stu().filter(s => !q || nm(s.name).includes(q));
  return `<div class="flex justify-between items-center mb-3">${h2('All Students (' + L.length + ')').replace('mb-3', 'mb-0')}<button data-a="addT" class="bg-indigo-600 text-white text-xs font-bold px-3 py-2 rounded-lg">${S.add ? 'Close' : '+ Add Student'}</button></div>
  ${S.add ? `<div class="p-3 mb-4 border-2 border-indigo-200 rounded-2xl space-y-2 bg-indigo-50"><input data-in="n_name" value="${esc(S.f.n_name || '')}" placeholder="Student name" class="${inp}"><div class="flex gap-2"><input data-in="n_cls" value="${esc(S.f.n_cls || '')}" placeholder="Class" class="${inp}"><input data-in="n_fee" type="number" value="${esc(S.f.n_fee || '')}" placeholder="Monthly fee ₹" class="${inp}"></div><input data-in="n_phone" type="tel" value="${esc(S.f.n_phone || '')}" placeholder="Parent WhatsApp number" class="${inp}"><button data-a="addStu" class="${btn}">Save Student</button></div>` : ''}
  <input data-in="q" value="${esc(S.f.q || '')}" placeholder="🔍 Search student..." class="${inp} mb-3">
  ` + (L.length ? L.map(s => {
    const a = attStat(s.id, MONTH0).pct, t = avgPct(s.id), p = pend(s);
    return `<div class="p-3 mb-3 border rounded-2xl shadow-sm"><div class="flex justify-between items-start"><div class="flex items-center gap-3">${av(s.name)}<div><p class="font-bold">${esc(s.name)}</p><p class="text-xs text-slate-500">Class ${esc(s.cls)} · ₹${esc(s.fee || 0)}/month</p></div></div>
      <span class="text-[11px] font-bold px-2 py-0.5 rounded ${p.length ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-700'}">${p.length ? 'Fee pending' : 'Fee paid'}</span></div>
      ${bar('Attendance (' + MN[+MONTH0.slice(5) - 1] + ')', a, 'green')}${bar('Test average', t, 'indigo')}
      <button data-a="delStu" data-id="${s.id}" class="mt-2 text-[11px] text-slate-400 underline">Remove student</button></div>`;
  }).join('') : empty('No students yet. Tap “+ Add Student”.'));
}
function aTests() {
  const L = stu().filter(s => s.cls === S.cls);
  const T = Object.entries(db.tests || {}).map(([tid, t]) => ({ tid, ...t })).sort((a, b) => (b.date + b.tid).localeCompare(a.date + a.tid)).slice(0, 6);
  const last = T[0], top = last ? Object.entries(last.marks || {}).sort((a, b) => b[1] - a[1]).slice(0, 3) : [];
  return `${h2('New Test')}<div class="space-y-2 mb-6"><input data-in="t_title" value="${esc(S.f.t_title || '')}" placeholder="Test name (e.g. Weekly Test 5)" class="${inp}">
  <div class="flex gap-2">${clsSel(false)}<input data-in="t_max" type="number" value="${esc(S.f.t_max ?? 50)}" placeholder="Max marks" class="${inp} !w-28"></div>
  ${L.map(s => `<div class="flex items-center justify-between p-2 border rounded-xl"><span class="text-sm font-semibold">${esc(s.name)}</span><input data-in="m_${s.id}" type="number" value="${esc(S.f['m_' + s.id] ?? '')}" placeholder="Marks" class="w-24 p-2 border rounded-lg text-sm text-center"></div>`).join('')}
  ${S.cls ? `<button data-a="saveTest" class="${btn}">Save Test Marks</button>` : '<p class="text-xs text-slate-400">Choose a class to enter marks.</p>'}</div>
  ${top.length ? `<div class="p-3 mb-4 rounded-2xl bg-gradient-to-r from-amber-100 to-yellow-50 border border-amber-200"><p class="text-xs font-bold text-amber-700 mb-2">🏆 Toppers · ${esc(last.title)} (Class ${esc(last.cls)})</p>${top.map(([id, v], i) => `<div class="flex justify-between text-sm py-0.5"><span>${['🥇', '🥈', '🥉'][i]} ${esc((db.students && db.students[id] && db.students[id].name) || '—')}</span><b>${v}/${last.max}</b></div>`).join('')}</div>` : ''}${h2('Recent Tests')}` + (T.length ? T.map(t => {
    const v = Object.values(t.marks || {}).filter(x => x !== ''), av = v.length ? Math.round(v.reduce((a, x) => a + +x, 0) / v.length) : 0;
    return `<div class="p-3 mb-2 border rounded-2xl flex justify-between"><div><p class="font-bold text-sm">${esc(t.title)}</p><p class="text-xs text-slate-500">Class ${esc(t.cls)} · ${t.date}</p></div><p class="text-sm font-bold text-indigo-700">Avg ${av}/${t.max}</p></div>`;
  }).join('') : empty('No tests yet'));
}

/* ---------- student views ---------- */
function sHome(me) {
  const a = attStat(me.id, MONTH0), p = pend(me), amt = p.length * (+me.fee || 0), hw = (db.hw && db.hw[ncls(me.cls)]) || '';
  return `<div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-4 rounded-3xl shadow-lg mb-3 flex items-center gap-3">${av(me.name)}<div><p class="text-xs text-indigo-200">Welcome 👋</p><h3 class="text-lg font-bold">${esc(me.name)}</h3><p class="text-xs text-indigo-200">Class ${esc(me.cls)} · ${esc(ACADEMY)}</p></div></div>
  <div class="grid grid-cols-2 gap-3 mb-3">${card('Attendance ' + MN[+MONTH0.slice(5) - 1], a.pct === null ? '–' : a.pct + '%', 'green')}${card('Pending Fee', '₹' + amt, amt ? 'orange' : 'green')}</div>
  <div class="p-4 border rounded-2xl bg-slate-50 mb-3"><p class="text-[11px] text-slate-500 font-semibold uppercase mb-1">Today's Homework</p><p class="text-sm font-medium whitespace-pre-line">${hw ? esc(hw) : 'No homework added yet.'}</p></div>
  ${amt ? `<a href="upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(ACADEMY)}&am=${amt}&cu=INR&tn=${encodeURIComponent('Fee ' + me.name)}" class="block text-center ${btn} !bg-emerald-600 mb-3">Pay ₹${amt} via UPI</a>` : ''}
  ${h2('Fee History')}${[...Array(4)].map((_, i) => shiftM(MONTH0, -i)).filter(m => m >= (me.joined || MONTH0)).map(m => `<div class="flex justify-between p-2.5 mb-1.5 border rounded-xl text-sm"><span>${mLabel(m)}</span><span class="font-bold ${me.paid && me.paid[m] ? 'text-green-600' : 'text-red-500'}">${me.paid && me.paid[m] ? 'Paid ✔' : 'Pending'}</span></div>`).join('')}`;
}
function sCal(me) {
  const [y, mo] = S.month.split('-').map(Number), first = new Date(y, mo - 1, 1).getDay(), days = new Date(y, mo, 0).getDate(), st = attStat(me.id, S.month);
  let cells = '<div class="text-center text-[11px] font-bold text-slate-400">' + ['S', 'M', 'T', 'W', 'T', 'F', 'S'].join('</div><div class="text-center text-[11px] font-bold text-slate-400">') + '</div>' + '<div></div>'.repeat(first);
  for (let d = 1; d <= days; d++) {
    const v = db.att && db.att[S.month + '-' + pad(d)] && db.att[S.month + '-' + pad(d)][me.id];
    cells += `<div class="aspect-square flex items-center justify-center rounded-lg text-sm font-semibold ${v === 'P' ? 'bg-green-500 text-white' : v === 'A' ? 'bg-red-500 text-white' : 'bg-slate-100 text-slate-400'}">${d}</div>`;
  }
  return `<div class="flex justify-between items-center mb-3"><button data-a="pm" class="px-3 py-1.5 bg-slate-100 rounded-lg font-bold">‹</button><h2 class="font-bold">${mLabel(S.month)}</h2><butt
