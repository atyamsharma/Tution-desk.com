<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuitionDesk - Student & Admin Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 space-y-6">
        <!-- App Header -->
        <div class="text-center space-y-2">
            <div class="inline-block bg-indigo-600 p-3 rounded-full text-white shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                </svg>
            </div>
            <h1 id="app-title" class="text-2xl font-bold text-slate-800">TuitionDesk</h1>
            <p class="text-sm text-slate-500">Select your role to sign in</p>
        </div>

        <!-- Role Selector Tabs -->
        <div class="flex bg-slate-100 p-1 rounded-xl">
            <button id="tab-student" onclick="switchTab('student')" class="flex-1 py-2 text-sm font-medium rounded-lg bg-white text-slate-800 shadow-sm transition">Student / Parent</button>
            <button id="tab-admin" onclick="switchTab('admin')" class="flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 transition">Admin / Staff</button>
        </div>

        <!-- Student Login View -->
        <div id="view-student" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Select Student Name</label>
                <select id="student-select" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="">-- Choose Student --</option>
                </select>
            </div>
            <button onclick="openStudentDashboard()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg transition">
                Enter Student Dashboard
            </button>
        </div>

        <!-- Admin Login View -->
        <div id="view-admin" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Enter Admin PIN</label>
                <input type="password" id="admin-pin" placeholder="Default PIN: 12345" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center tracking-widest font-mono">
            </div>
            <div id="login-error" class="text-red-500 text-xs text-center hidden font-medium">गलत पिन! कृपया सही पिन (12345) दर्ज करें।</div>
            <button onclick="verifyAdminPin()" class="w-full bg-slate-900 hover:bg-black text-white font-semibold py-3 rounded-xl shadow-lg transition">
                Unlock Admin Console
            </button>
        </div>
    </div>

    <script>
        function switchTab(role) {
            const studentTab = document.getElementById('tab-student');
            const adminTab = document.getElementById('tab-admin');
            const studentView = document.getElementById('view-student');
            const adminView = document.getElementById('view-admin');
            const errorDiv = document.getElementById('login-error');

            errorDiv.classList.add('hidden');

            if (role === 'student') {
                studentTab.className = "flex-1 py-2 text-sm font-medium rounded-lg bg-white text-slate-800 shadow-sm transition";
                adminTab.className = "flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 transition";
                studentView.classList.remove('hidden');
                adminView.classList.add('hidden');
            } else {
                adminTab.className = "flex-1 py-2 text-sm font-medium rounded-lg bg-white text-slate-800 shadow-sm transition";
                studentTab.className = "flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 transition";
                adminView.classList.remove('hidden');
                studentView.classList.add('hidden');
            }
        }

        function verifyAdminPin() {
            const pinInput = document.getElementById('admin-pin').value.trim();
            const errorDiv = document.getElementById('login-error');

            if (pinInput === "12345") {
                errorDiv.classList.add('hidden');
                alert("एडमिन कंसोल सफलतापूर्वक अनलॉक हो गया है!");
                // यहाँ आप आगे एडमिन डैशबोर्ड ओपन करने का कोड जोड़ सकते हैं
            } else {
                errorDiv.classList.remove('hidden');
            }
        }

        function openStudentDashboard() {
            const select = document.getElementById('student-select');
            if (!select.value) {
                alert("कृपया पहले छात्र का नाम चुनें।");
                return;
            }
            alert("छात्र डैशबोर्ड जल्द खुलेगा।");
        }
    </script>
</body>
</html>
