<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuitionDesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-gradient-to-r from-indigo-600 to-violet-700 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">TuitionDesk</h1>
            <p class="text-indigo-200 text-xs mt-1">Tuition Management System</p>
        </div>

        <!-- Auth View -->
        <div id="view-auth" class="p-6 space-y-6">
            <div class="flex bg-slate-100 p-1 rounded-xl">
                <button id="btn-tab-student" onclick="showAuthTab('student')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-indigo-600 shadow-sm">Student / Parent</button>
                <button id="btn-tab-admin" onclick="showAuthTab('admin')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500">Admin / Staff</button>
            </div>

            <!-- Student View -->
            <div id="auth-student" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Select Student Name</label>
                    <select class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800">
                        <option>Aarav Sharma</option>
                        <option>Priya Verma</option>
                        <option>Kabir Singh</option>
                    </select>
                </div>
                <button onclick="loginAsStudent()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl shadow-md hover:bg-indigo-700">Enter Student Dashboard</button>
            </div>

            <!-- Admin View -->
            <div id="auth-admin" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Enter Admin PIN</label>
                    <input type="password" id="pin-input" placeholder="Default PIN: 12345" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-center tracking-widest text-slate-800">
                </div>
                <div id="pin-error" class="text-red-500 text-xs text-center hidden font-medium">Wrong PIN! Try 12345</div>
                <button onclick="loginAsAdmin()" class="w-full bg-slate-900 text-white font-semibold py-3 rounded-xl shadow-md hover:bg-black">Unlock Admin Console</button>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="view-dash" class="hidden p-6 space-y-6">
            <div class="flex justify-between items-center border-b pb-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800" id="dash-title">Admin Dashboard</h2>
                    <p class="text-xs text-slate-500">Welcome Back</p>
                </div>
                <button onclick="logout()" class="text-xs bg-red-100 text-red-600 font-semibold px-3 py-1.5 rounded-lg">Logout</button>
            </div>

            <!-- Stats -->
            <div id="admin-stats" class="grid grid-cols-2 gap-3">
                <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100">
                    <p class="text-xs font-semibold text-indigo-600 uppercase">Total Students</p>
                    <p class="text-2xl font-bold text-indigo-950 mt-1">24</p>
                </div>
                <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                    <p class="text-xs font-semibold text-emerald-600 uppercase">Fees Collected</p>
                    <p class="text-2xl font-bold text-emerald-950 mt-1">₹1.2L</p>
                </div>
            </div>

            <!-- Tabs Navigation -->
            <div id="admin-tabs" class="space-y-2">
                <p class="text-xs font-semibold text-slate-400 uppercase">Console Tabs</p>
                <div class="grid grid-cols-2 gap-2 text-sm font-semibold">
                    <button onclick="alert('Students Tab Loaded')" class="bg-slate-50 hover:bg-slate-100 p-3 rounded-xl border text-slate-700 text-left">👨‍🎓 Students List</button>
                    <button onclick="alert('Attendance Tab Loaded')" class="bg-slate-50 hover:bg-slate-100 p-3 rounded-xl border text-slate-700 text-left">📋 Attendance</button>
                    <button onclick="alert('Fees Tab Loaded')" class="bg-slate-50 hover:bg-slate-100 p-3 rounded-xl border text-slate-700 text-left">💳 Fee Counter</button>
                    <button onclick="alert('Settings Tab Loaded')" class="bg-slate-50 hover:bg-slate-100 p-3 rounded-xl border text-slate-700 text-left">⚙️ Settings</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showAuthTab(type) {
            const isStu = type === 'student';
            document.getElementById('auth-student').classList.toggle('hidden', !isStu);
            document.getElementById('auth-admin').classList.toggle('hidden', isStu);
            document.getElementById('btn-tab-student').className = `flex-1 py-2 text-sm font-semibold rounded-lg ${isStu ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'}`;
            document.getElementById('btn-tab-admin').className = `flex-1 py-2 text-sm font-semibold rounded-lg ${!isStu ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'}`;
            document.getElementById('pin-error').classList.add('hidden');
        }

        function loginAsAdmin() {
            const pin = document.getElementById('pin-input').value.trim();
            if (pin === "12345") {
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('view-dash').classList.remove('hidden');
                document.getElementById('dash-title').innerText = "Admin Dashboard";
                document.getElementById('admin-stats').classList.remove('hidden');
                document.getElementById('admin-tabs').classList.remove('hidden');
            } else {
                document.getElementById('pin-error').classList.remove('hidden');
            }
        }

        function loginAsStudent() {
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('view-dash').classList.remove('hidden');
            document.getElementById('dash-title').innerText = "Student Dashboard";
            document.getElementById('admin-stats').classList.add('hidden');
            document.getElementById('admin-tabs').classList.add('hidden');
        }

        function logout() {
            document.getElementById('view-dash').classList.add('hidden');
            document.getElementById('view-auth').classList.remove('hidden');
            document.getElementById('pin-input').value = '';
        }
    </script>
</body>
</html>
