<!DOCTYPE html>
<html lang="hi" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuitionDesk - کامل مینجمنٹ ایپ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex flex-col justify-center items-center p-4 font-sans">

    <!-- Main Container -->
    <div id="app-container" class="w-full max-w-lg bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        
        <!-- HEADER -->
        <div class="bg-gradient-to-r from-indigo-600 to-violet-700 p-6 text-white text-center relative">
            <h1 id="app-title" class="text-2xl font-black tracking-tight">TuitionDesk</h1>
            <p id="app-subtitle" class="text-indigo-100 text-sm mt-1 font-medium">ٹیوشن مینجمنٹ سسٹم</p>
        </div>

        <!-- VIEW 1: AUTHENTICATION (Initial) -->
        <div id="view-auth" class="p-6 space-y-6">
            <div class="flex bg-slate-100 p-1.5 rounded-2xl">
                <button id="tab-auth-student" onclick="switchAuthMode('student')" class="flex-1 py-3 text-sm font-bold rounded-xl bg-white text-indigo-600 shadow-md transition-all">اسٹوڈنٹ / پیرنٹ</button>
                <button id="tab-auth-admin" onclick="switchAuthMode('admin')" class="flex-1 py-3 text-sm font-bold rounded-xl text-slate-600 transition-all">ایڈمن / اسٹاف</button>
            </div>

            <!-- Student Login -->
            <div id="form-student" class="space-y-4 animate-fadeIn">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">طالب علم کا نام منتخب کریں</label>
                    <select id="student-selector" class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-4 py-3.5 font-bold text-slate-800 focus:border-indigo-500 focus:outline-none">
                        <option value="Aarav">آرو شرما</option>
                        <option value="Priya">پریا ورما</option>
                        <option value="Kabir">کبیر سنگھ</option>
                    </select>
                </div>
                <button onclick="loginAsStudent()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-200 transition-all transform active:scale-98">اسٹوڈنٹ ڈیش بورڈ کھولیں</button>
            </div>

            <!-- Admin Login -->
            <div id="form-admin" class="space-y-4 hidden animate-fadeIn">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">ایڈمن پن درج کریں</label>
                    <input type="password" id="admin-pin-input" placeholder="ڈیفالٹ پن: 12345" class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-4 py-3.5 font-mono text-center tracking-widest font-black text-slate-800 focus:border-indigo-500 focus:outline-none">
                </div>
                <div id="admin-login-error" class="bg-red-50 text-red-600 text-xs font-bold p-3 rounded-xl border border-red-200 text-center hidden">غلط پن! برائے مہربانی 12345 درج کریں۔</div>
                <button onclick="verifyAdminPin()" class="w-full bg-slate-900 hover:bg-black text-white font-black py-4 rounded-2xl shadow-lg transition-all transform active:scale-98">ایڈمن کنسول ان لاک کریں</button>
            </div>
        </div>

        <!-- VIEW 2: DASHBOARD (Hidden Initially) -->
        <div id="view-dashboard" class="hidden flex flex-col h-[600px]">
            <!-- Dashboard Header -->
            <div class="bg-slate-50 border-b p-4 flex items-center justify-between">
                <div>
                    <h2 id="dashboard-user-title" class="text-lg font-black text-slate-800">ڈیش بورڈ</h2>
                    <p class="text-xs text-slate-500 font-medium">آج کی تاریخ: <span id="current-date"></span></p>
                </div>
                <button onclick="logout()" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold px-4 py-2 rounded-xl transition-all">لاگ آؤٹ</button>
            </div>

            <!-- Stats Bar (Visible in Admin) -->
            <div id="admin-stats-bar" class="grid grid-cols-2 gap-3 p-4 bg-indigo-900 text-white">
                <div class="bg-indigo-800/50 p-3 rounded-2xl border border-indigo-700/50">
                    <p class="text-[10px] uppercase font-bold text-indigo-200">کل طلبا</p>
                    <p class="text-2xl font-black mt-1">24</p>
                </div>
                <div class="bg-indigo-800/50 p-3 rounded-2xl border border-indigo-700/50">
                    <p class="text-[10px] uppercase font-bold text-indigo-200">فیس جمع</p>
                    <p class="text-2xl font-black mt-1">₹1,20,000</p>
                </div>
            </div>

            <!-- TAB CONTENT AREA -->
            <div id="tab-content" class="flex-1 p-6 overflow-y-auto space-y-6">
                <!-- Dynamic tabs will render here -->
            </div>

            <!-- TAB NAVIGATION BAR -->
            <div id="admin-nav-bar" class="grid grid-cols-5 border-t bg-white py-2 px-1 text-center">
                <button onclick="switchTab('overview')" id="nav-btn-overview" class="py-2 text-slate-600 hover:text-indigo-600 transition-all flex flex-col items-center">
                    <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    <span class="text-[10px] font-bold">ہوم</span>
                </button>
                <button onclick="switchTab('students')" id="nav-btn-students" class="py-2 text-slate-400 hover:text-indigo-600 transition-all flex flex-col items-center">
                    <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <span class="text-[10px] font-bold">طلبا</span>
                </button>
                <button onclick="switchTab('attendance')" id="nav-btn-attendance" class="py-2 text-slate-400 hover:text-indigo-600 transition-all flex flex-col items-center">
                    <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                    <span class="text-[10px] font-bold">حاضری</span>
                </button>
                <button onclick="switchTab('fees')" id="nav-btn-fees" class="py-2 text-slate-400 hover:text-indigo-600 transition-all flex flex-col items-center">
                    <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    <span class="text-[10px] font-bold">فیس</span>
                </button>
                <button onclick="switchTab('settings')" id="nav-btn-settings" class="py-2 text-slate-400 hover:text-indigo-600 transition-all flex flex-col items-center">
                    <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                    <span class="text-[10px] font-bold">سیٹنگز</span>
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let currentUserRole = 'student';
        let currentActiveTab = 'overview';

        // Set date
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('ur-PK');

        function switchAuthMode(mode) {
            currentUserRole = mode;
            const stuTab = document.getElementById('tab-auth-student');
            const adminTab = document.getElementById('tab-auth-admin');
            const stuForm = document.getElementById('form-student');
            const adminForm = document.getElementById('form-admin');

            if (mode === 'student') {
                stuTab.className = "flex-1 py-3 text-sm font-bold rounded-xl bg-white text-indigo-600 shadow-md transition-all";
                adminTab.className = "flex-1 py-3 text-sm font-bold rounded-xl text-slate-600 transition-all";
                stuForm.classList.remove('hidden');
                adminForm.classList.add('hidden');
            } else {
                adminTab.className = "flex-1 py-3 text-sm font-bold rounded-xl bg-white text-indigo-600 shadow-md transition-all";
                stuTab.className = "flex-1 py-3 text-sm font-bold rounded-xl text-slate-600 transition-all";
                adminForm.classList.remove('hidden');
                stuForm.classList.add('hidden');
                document.getElementById('admin-login-error').classList.add('hidden');
            }
        }

        function verifyAdminPin() {
            const pin = document.getElementById('admin-pin-input').value.trim();
            if (pin === "12345") {
                document.getElementById('admin-login-error').classList.add('hidden');
                alert("ایڈمن کنسول کامیابی سے ان لاک ہو گیا!");
                initDashboard('admin');
            } else {
                document.getElementById('admin-login-error').classList.remove('hidden');
            }
        }

        function loginAsStudent() {
            const studentName = document.getElementById('student-selector').value;
            alert("خوش آمدید " + studentName + "!");
            initDashboard('student');
        }

        function initDashboard(role) {
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            
            const statsBar = document.getElementById('admin-stats-bar');
            const navBar = document.getElementById('admin-nav-bar');

            if (role === 'admin') {
                document.getElementById('dashboard-user-title').innerText = "ایڈمنسٹریٹر پینل";
                statsBar.classList.remove('hidden');
                navBar.classList.remove('hidden');
                switchTab('overview');
            } else {
                document.getElementById('dashboard-user-title').innerText = "اسٹوڈنٹ پورٹل";
                statsBar.classList.add('hidden');
                navBar.classList.add('hidden');
                renderStudentView();
            }
        }

        function switchTab(tabId) {
            currentActiveTab = tabId;
            // Update button styles
            ['overview', 'students', 'attendance', 'fees', 'settings'].forEach(id => {
                const btn = document.getElementById(`nav-btn-${id}`);
                btn.className = "py-2 transition-all flex flex-col items-center " + (id === tabId ? "text-indigo-600 font-black scale-105" : "text-slate-400 hover:text-slate-600");
            });

            renderTabContent(tabId);
        }

        function renderTabContent(tabId) {
            const container = document.getElementById('tab-content');
            container.innerHTML = ''; // Clear

            switch(tabId) {
                case 'overview':
                    container.innerHTML = `
                        <div class="space-y-4">
                            <div class="bg-gradient-to-br from-indigo-500 to-violet-600 p-6 rounded-3xl text-white shadow-lg">
                                <h3 class="text-xl font-black">TuitionDesk میں خوش آمدید</h3>
                                <p class="text-xs text-indigo-100 mt-1">آج کے اہم نوٹس اور ٹاسک</p>
                            </div>
                            <h4 class="font-bold text-slate-700 text-sm">فوری اقدامات</h4>
                            <div class="grid grid-cols-2 gap-3">
                                <button onclick="switchTab('students')" class="bg-slate-50 p-4 rounded-2xl border text-center font-bold text-xs text-slate-700 hover:border-indigo-500">طالب علم شامل کریں</button>
                                <button onclick="switchTab('attendance')" class="bg-slate-50 p-4 rounded-2xl border text-center font-bold text-xs text-slate-700 hover:border-indigo-500">حاضری مارک کریں</button>
                            </div>
                        </div>
                    `;
                    break;
                case 'students':
                    container.innerHTML = `
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="font-black text-slate-800">طلباء کا ریکارڈ</h3>
                                <button onclick="alert('نیا طالب علم شامل کرنے کا فارم')" class="bg-indigo-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl">+ نیا طالب علم</button>
                            </div>
                            <div class="divide-y border-y">
                                <div class="py-3 flex justify-between items-center"><span class="font-bold text-sm">آرو شرما</span><span class="text-xs text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full font-bold">کلاس 10</span></div>
                                <div class="py-3 flex justify-between items-center"><span class="font-bold text-sm">پریا ورما</span><span class="text-xs text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full font-bold">کلاس 12</span></div>
                                <div class="py-3 flex justify-between items-center"><span class="font-bold text-sm">کبیر سنگھ</span><span class="text-xs text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full font-bold">کلاس 9</span></div>
                            </div>
                        </div>
                    `;
                    break;
                case 'attendance':
                    container.innerHTML = `
                        <div class="space-y-4">
                            <h3 class="font-black text-slate-800">ڈیلی حاضری</h3>
                            <div class="space-y-3">
                                <div class="bg-slate-50 p-3 rounded-2xl flex justify-between items-center"><span class="font-bold text-sm">آرو شرما</span><span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-lg font-bold">حاضر</span></div>
                                <div class="bg-slate-50 p-3 rounded-2xl flex justify-between items-center"><span class="font-bold text-sm">پریا ورما</span><span class="text-xs bg-red-100 text-red-700 px-3 py-1 rounded-lg font-bold">غیر حاضر</span></div>
                                <div class="bg-slate-50 p-3 rounded-2xl flex justify-between items-center"><span class="font-bold text-sm">کبیر سنگھ</span><span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-lg font-bold">حاضر</span></div>
                            </div>
                        </div>
                    `;
                    break;
                case 'fees':
                    container.innerHTML = `
                        <div class="space-y-4">
                            <h3 class="font-black text-slate-800">فیس کاؤنٹر</h3>
                            <div class="space-y-3">
                                <div class="bg-slate-50 p-3 rounded-2xl flex justify-between items-center"><div><p class="font-bold text-sm">آرو شرما</p><p class="text-[10px] text-slate-400">نومبر فیس ادا شدہ</p></div><span class="font-black text-emerald-600 text-sm">₹1,500</span></div>
                                <div class="bg-slate-50 p-3 rounded-2xl flex justify-between items-center"><div><p class="font-bold text-sm">پریا ورما</p><p class="text-[10px] text-red-400">نومبر فیس بقایا</p></div><span class="font-black text-red-600 text-sm">باقی</span></div>
                            </div>
                        </div>
                    `;
                    break;
                case 'settings':
                    container.innerHTML = `
                        <div class="space-y-4">
                            <h3 class="font-black text-slate-800">ایپ سیٹنگز</h3>
                            <div class="bg-slate-50 p-4 rounded-2xl space-y-3">
                                <div class="flex justify-between items-center"><span class="text-sm font-bold">ایپ کا نام تبدیل کریں</span><button onclick="alert('نام تبدیل ہو گیا')" class="text-xs text-indigo-600 font-bold">ایڈٹ</button></div>
                                <hr>
                                <div class="flex justify-between items-center"><span class="text-sm font-bold">ایڈمن پن تبدیل کریں</span><button onclick="alert('پن تبدیل ہو گیا')" class="text-xs text-indigo-600 font-bold">تبدیل</button></div>
                            </div>
                        </div>
                    `;
                    break;
            }
        }

        function renderStudentView() {
            document.getElementById('tab-content').innerHTML = `
                <div class="space-y-6">
                    <div class="bg-slate-50 p-6 rounded-3xl border text-center">
                        <h3 class="font-black text-lg text-slate-800">طالب علم کا ڈیش بورڈ</h3>
                        <p class="text-xs text-slate-500 mt-2">یہاں آپ اپنے ٹیسٹ مارکس اور حاضری دیکھ سکتے ہیں۔</p>
                    </div>
                </div>
            `;
        }

        function logout() {
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-auth').classList.remove('hidden');
        }
    </script>
</body>
</html>
